<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="门头沟区市场监督管理局 - 个体工商户设立在线申报">
    <title>个体工商户设立在线申报 - 门头沟区市场监督管理局</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sub.css">
</head>
<body>
<div class="wrapper">
    <div class="sub-header">
        <div class="sub-header-inner">
            <a class="sub-back" href="gtgs.html" aria-label="返回个体工商户设立智能申报">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <path d="M15 4L7 12L15 20" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>返回</span>
            </a>
            <h1 class="sub-title">个体户设立 · 在线申报</h1>
            <div class="sub-header-ghost" aria-hidden="true"></div>
        </div>
    </div>

    <div class="sub-main">
        <div class="action-card">
            <div class="sec-title" style="margin-top:0">官方在线办理</div>
            <a class="action-btn" href="https://portal.bjt.beijing.gov.cn/p/login/login.html?pubKey=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCF4+ClKycPi5xGHMtxpzBQgJxKOece8+SRds8dWMDTE1u43zMQXivk7y57qF8qGxMESLi+3uWgLzc7eBnbVmZLMIKOglR9YirYqf9vOvbqorCYefDJQdYRAqffOCz3+Z/p2zUo3YyD1PNWJqdNbsjLoC32/nlkyj5Jz6pPsM23+QIDAQAB" target="_blank" rel="noopener">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <path d="M18 13V19C18 19.5523 17.5523 20 17 20H5C4.44772 20 4 19.5523 4 19V7C4 6.44772 4.44772 6 5 6H11" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M14 4H20V10" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20 4L11 13" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                前往"北京市企业服务e窗通"办理
            </a>
            <div class="action-note">建议使用电脑端 Chrome / Edge 浏览器，首次办理需完成实名认证。</div>
        </div>

        <div class="sec-title">智能申报引导</div>
        <form class="declare-form" id="declareForm" onsubmit="handleDeclarationSubmit(event)">
            <div class="form-group">
                <label class="form-label" for="f1">字号名称</label>
                <input class="form-input" id="f1" name="storeName" type="text" placeholder="如：北京××小吃店（无字号可留空）">
            </div>
            <div class="form-group">
                <label class="form-label" for="f2">经营者姓名<span class="req">*</span></label>
                <input class="form-input" id="f2" name="ownerName" type="text" placeholder="请输入姓名" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="f3">联系电话<span class="req">*</span></label>
                <input class="form-input" id="f3" name="phone" type="tel" pattern="1[3-9][0-9]{9}" placeholder="请输入手机号码" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="f4">拟经营范围<span class="req">*</span></label>
                <textarea class="form-textarea" id="f4" name="businessScope" placeholder="如：餐饮服务；预包装食品零售等" required></textarea>
            </div>
            <div class="form-group">
                <label class="form-label" for="f5">经营场所地址<span class="req">*</span></label>
                <input class="form-input" id="f5" name="address" type="text" placeholder="请填写详细地址" required>
            </div>
            <button type="submit" class="action-btn">提交预审信息</button>
            <div class="action-note">本表单为本地演示，信息仅保存在当前浏览器，不会上传到任何服务器。</div>
        </form>

        <div class="success-box" id="successBox">
            <div class="success-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <path d="M5 12.5L10 17.5L19 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="success-title">提交成功</div>
            <div class="success-text">当前为本地演示，信息不会上传。正式办理请前往"北京市企业服务e窗通"平台提交材料。</div>
            <button class="action-btn secondary" style="margin-top:3vw" onclick="resetDeclaration()">重新填写</button>
        </div>
    </div>

    <div class="sub-footer">门头沟区市场监督管理局 · 智能服务</div>
</div>
<script src="js/sub.js"></script>
</body>
</html>
